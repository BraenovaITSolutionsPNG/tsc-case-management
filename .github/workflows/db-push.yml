# Apply the schema in drizzle/ to the deployed database.
#
# The platform runs on Supabase, and migrating it from a laptop is not something
# to rely on: the direct connection has to be reachable, and the result should be
# the same whoever pushes. A GitHub runner is the same on every machine, which
# settles both.
#
# DATABASE_URL must be the *direct* connection (Supabase's 5432), not the session
# pooler on 6543. DDL runs in a transaction and the pooler discards the backend
# between transactions, so a migration sent through the pooler fails partway
# through with the schema half applied.
#
# Secrets: DATABASE_URL, a repository secret holding that 5432 string.
name: db push
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - drizzle/**
      - drizzle.config.ts
      - server/_core/databaseConnection.ts
      - scripts/verify-schema.ts
      - package.json
      - pnpm-lock.yaml
      - .github/workflows/db-push.yml
concurrency:
  # Two migrations against one database at once is how a half-applied schema
  # happens. A push while one is running queues behind it rather than racing.
  group: db-push
  cancel-in-progress: false
jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # Supabase's certificate chains to a public CA, so the host trust store
      # verifies it and no CA file is needed. Named here so the one thing that
      # would have to change if that ever stops being true is visible.
      DATABASE_SSL: require
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # `migrate` and not `pnpm db:push`, which is `generate` then `migrate`:
      # generate writes a new migration file, and a file generated on a runner
      # and never committed is a migration nobody reviewed. Schema changes are
      # generated and committed locally, where they can be read.
      - run: pnpm exec drizzle-kit migrate
      # Turns "the job went green" into "the tables are there", which is the
      # difference between a green job and a working application.
      - run: pnpm db:verify
