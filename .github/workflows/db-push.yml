# Apply the schema in drizzle/ to the deployed database.
#
# The platform runs on Supabase, and migrating it from a laptop is not something
# to rely on: the direct connection has to be reachable, and the result should be
# the same whoever pushes. A GitHub runner is the same on every machine, which
# settles both.
#
# DATABASE_URL must be the *session* pooler (aws-<region>.pooler.supabase.com on
# 5432), and not either of the alternatives, for two separate reasons:
#
#   - Not the direct host (db.<ref>.supabase.co:5432). It publishes only an AAAA
#     record, the hosted runner has no IPv6 route, and the connection dies with
#     ENETUNREACH before a statement runs.
#   - Not the transaction pooler on 6543. DDL runs in a transaction and that mode
#     hands the backend back between transactions, so a migration sent through it
#     fails partway with the schema half applied.
#
# Secrets: DATABASE_URL, a repository secret holding that session-pooler string,
# and DATABASE_CA_CERT, the PEM the pooler's certificate chains to. Both are
# required; the reasons are on the env block below.
name: db push
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - drizzle/**
      - drizzle.config.ts
      - server/_core/databaseConnection.ts
      - scripts/verify-schema.ts
      - package.json
      - pnpm-lock.yaml
      - .github/workflows/db-push.yml
concurrency:
  # Two migrations against one database at once is how a half-applied schema
  # happens. A push while one is running queues behind it rather than racing.
  group: db-push
  cancel-in-progress: false
jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      # The *session* pooler, not the direct host. The direct host
      # (db.<ref>.supabase.co:5432) publishes only an AAAA record, and the hosted
      # runner has no IPv6 route, so a migration sent there fails with
      # ENETUNREACH before a single statement runs. The pooler host is IPv4 and
      # session mode holds the backend for the life of the connection, which is
      # what DDL needs.
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # The pooler presents a certificate signed by Supabase's own CA, not a
      # public one, so the runner's trust store cannot verify it and the
      # connection fails with SELF_SIGNED_CERT_IN_CHAIN. DATABASE_CA_CERT is what
      # fixes that: databaseConnection.ts verifies against exactly this
      # certificate, and it is passed to `migrate` and `db:verify` alike through
      # that one module. Set it to the CA from Dashboard -> Database -> SSL
      # Configuration, as the PEM itself — a path does not exist on a runner.
      DATABASE_CA_CERT: ${{ secrets.DATABASE_CA_CERT }}
      # Only consulted when DATABASE_CA_CERT is empty, and it is the weaker of the
      # two: it verifies against the host trust store, which is correct for a
      # public-CA certificate and is not correct for the pooler. Left named so the
      # fallback is visible rather than silent.
      DATABASE_SSL: require
    steps:
      # Fails here, with an explanation, rather than three steps later with
      # SELF_SIGNED_CERT_IN_CHAIN.
      #
      # A missing secret is otherwise indistinguishable from a wrong one in the
      # log: `DATABASE_CA_CERT` expands to an empty string, `resolveSsl` falls
      # through to the DATABASE_SSL branch, and the connection is attempted
      # against the host trust store before it can be reported as unverifiable.
      # The error names a certificate, which sends the reader looking for a
      # certificate problem they do not have.
      - name: Refuse to run without the CA certificate
        if: ${{ secrets.DATABASE_CA_CERT == '' }}
        run: |
          echo "::error::DATABASE_CA_CERT is not set on this repository."
          echo "The session pooler presents a certificate signed by Supabase's own CA,"
          echo "which the runner's trust store cannot verify. Set the secret to the PEM"
          echo "from Supabase Dashboard -> Database -> SSL Configuration (pooler"
          echo "connections). A CA certificate is public, so it is safe as a secret."
          exit 1
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # `migrate` and not `pnpm db:push`, which is `generate` then `migrate`:
      # generate writes a new migration file, and a file generated on a runner
      # and never committed is a migration nobody reviewed. Schema changes are
      # generated and committed locally, where they can be read.
      - run: pnpm exec drizzle-kit migrate
      # Turns "the job went green" into "the tables are there", which is the
      # difference between a green job and a working application. It also asserts
      # row level security is on with no policies, so a database left readable
      # through the public anon key fails the deploy instead of passing it.
      - run: pnpm db:verify
