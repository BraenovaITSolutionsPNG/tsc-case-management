# PostgreSQL 17 for local development. The deployed platform runs on Supabase
# (see the Database section of .env.example); this service is what
# DATABASE_URL points at on a development machine, and nothing more.
#
#   docker compose up -d          start the database
#   docker compose down           stop it (data is kept in the named volume)
#   docker compose down -v        stop it and delete the data
#
# The app runs on the host, so DATABASE_URL in .env points at 127.0.0.1:5432 and
# this service only needs to publish the port. If you run the app in a container
# too, add it to the same network and switch the host in DATABASE_URL to the
# service name `postgres`.
#
# database/bootstrap.sql is mounted into the entrypoint init directory, so the
# database and application user are created on first start of an empty volume
# only. On an existing volume re-apply it with:
#   docker compose exec -T postgres psql -U postgres < database/bootstrap.sql
#
# Migrations are run against this service the same way as against Supabase, but
# note the port rule from databaseConnection.ts: DDL needs a real session, and
# that is why this service is a plain PostgreSQL rather than a pooler. Supabase's
# equivalent is its direct connection on 5432, not the session pooler on 6543.

services:
  postgres:
    image: postgres:17
    container_name: tsc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tsc_dev_password}
      POSTGRES_USER: postgres
      POSTGRES_DB: tsc_case_management
    ports:
      # Published on the host as 5433, not 5432. Another project's PostgreSQL
      # already holds 5432 on this machine, and two services cannot share a
      # published port — so this one moves rather than failing to start. The
      # container still listens on 5432 inside; only the host side differs.
      #
      # Nothing in the application depends on this number: DATABASE_URL carries
      # it. Change both together, or set POSTGRES_HOST_PORT and put the matching
      # number in DATABASE_URL.
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Runs once, when the data volume is first initialised.
      - ./database/bootstrap.sql:/docker-entrypoint-initdb.d/10-bootstrap.sql:ro
    healthcheck:
      # The app should not start migrating before the server accepts connections.
      test: ["CMD-SHELL", "pg_isready -U postgres -d tsc_case_management"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  postgres-data:
