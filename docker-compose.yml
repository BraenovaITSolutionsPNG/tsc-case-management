# Optional local PostgreSQL, for working offline or against a scratch database.
#
# NOT the default and not needed for normal development. The deployed platform
# runs on Supabase, and `.env` points DATABASE_URL there. Nothing in this file
# is read unless you deliberately start it:
#
#   docker compose up -d     start it, then point DATABASE_URL at it
#   docker compose down      stop it (the named volume keeps its data)
#   docker compose down -v   stop it and DELETE THE DATA — read that twice
#
# Two situations where it earns its place:
#
#   - A network that cannot reach Supabase. Some corporate and campus networks
#     block outbound Postgres (5432/6543) while allowing HTTPS, in which case a
#     local server is the only way to run the app at all.
#   - Schema work you do not want to try on the deployed database.
#
# When you do point at it, the credentials are the development defaults in
# database/bootstrap.sql:
#
#   DATABASE_URL=postgresql://tsc:tsc_dev_password@127.0.0.1:5433/tsc_case_management
#   DATABASE_SSL=disable
#
# 5433 rather than 5432 because another project's PostgreSQL already holds 5432
# on some machines, and two services cannot share a published port. The container
# listens on 5432 internally; only the host side differs, and DATABASE_URL is
# what carries the number. Override with POSTGRES_HOST_PORT if you need to.
#
# Migrations run against this the same way as against Supabase, with one
# difference that matters: this is a plain PostgreSQL, not a pooler, so DDL works
# directly. Supabase's equivalent is its *direct* connection on 5432 — migrations
# through the session pooler on 6543 half-apply while exiting green.

services:
  postgres:
    image: postgres:17
    container_name: tsc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tsc_dev_password}
      POSTGRES_USER: postgres
      POSTGRES_DB: tsc_case_management
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Creates the application role, once, when the volume is first initialised.
      # On an existing volume re-apply it with:
      #   docker compose exec -T postgres psql -U postgres < database/bootstrap.sql
      - ./database/bootstrap.sql:/docker-entrypoint-initdb.d/10-bootstrap.sql:ro
    healthcheck:
      # Nothing should start migrating before the server accepts connections.
      test: ["CMD-SHELL", "pg_isready -U postgres -d tsc_case_management"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  postgres-data:
