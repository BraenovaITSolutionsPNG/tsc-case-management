# Temporary diagnostic, third pass: prove the exact configuration the deployment
# will use, before it is put into production.
#
# Two things are settled here rather than guessed at:
#
#   1. Whether the password in `.env` is the same one the pooler secret holds.
#      The secret cannot be read, and the deployment needs the pooler host with a
#      password that works. Only a SHA-256 of each is compared, so neither is
#      disclosed; two mismatched deployments differing in one hash is the whole
#      signal, and a hash cannot be turned back into a password.
#   2. That the root CA recovered from the presented chain actually verifies the
#      connection, with verification switched on. `databaseConnection.ts` never
#      sets `rejectUnauthorized: false` and neither does this, so a green run
#      here means the deployment has a CA it can trust.
name: db probe
on:
  workflow_dispatch:
    inputs:
      local_password_fp:
        description: "SHA-256 prefix of the .env DATABASE_URL password, computed locally"
        required: true
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      LOCAL_PASS_FP: ${{ inputs.local_password_fp }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Compare password fingerprints
        run: |
          node -e '
          const crypto = require("node:crypto");
          const secret = decodeURIComponent(new URL(process.env.DATABASE_URL).password);
          const fp = s => crypto.createHash("sha256").update(s).digest("hex").slice(0, 16);
          console.log("PROBE secretPassFp=" + fp(secret) + " len=" + secret.length);
          console.log("PROBE givenLocalFp=" + process.env.LOCAL_PASS_FP);
          console.log("PROBE passwordsMatch=" + (fp(secret) === process.env.LOCAL_PASS_FP));
          '

      - name: Verify the pooler with the recovered root CA
        run: |
          node -e '
          const fs = require("node:fs");
          const { Client } = require("pg");
          const u = new URL(process.env.DATABASE_URL);
          // Re-derive the chain in-run so this does not depend on an artifact.
          (async () => {
            const c0 = new Client({ host: u.hostname, port: Number(u.port || 5432),
              user: decodeURIComponent(u.username), password: decodeURIComponent(u.password),
              database: u.pathname.replace(/^\//, ""), ssl: { rejectUnauthorized: false },
              connectionTimeoutMillis: 15000 });
            await c0.connect();
            let cert = c0.connection.stream.getPeerCertificate(true);
            const pems = [];
            let d = 0;
            while (cert && Object.keys(cert).length && d < 6) {
              pems.push("-----BEGIN CERTIFICATE-----\n" + cert.raw.toString("base64").match(/.{1,64}/g).join("\n") + "\n-----END CERTIFICATE-----\n");
              if (cert.issuerCertificate === cert) break;
              cert = cert.issuerCertificate; d++;
            }
            await c0.end();
            const ca = pems[pems.length - 1];
            fs.writeFileSync("ca.pem", ca);
            console.log("PROBE caBytes=" + ca.length);

            // Now the real test: verification ON, with that CA.
            const c = new Client({ host: u.hostname, port: Number(u.port || 5432),
              user: decodeURIComponent(u.username), password: decodeURIComponent(u.password),
              database: u.pathname.replace(/^\//, ""),
              ssl: { ca, rejectUnauthorized: true }, connectionTimeoutMillis: 15000 });
            try {
              await c.connect();
              const v = await c.query("select version() as v");
              console.log("PROBE verifiedOK version=" + v.rows[0].v.split(" ").slice(0,2).join(" "));
            } catch (e) {
              console.log("PROBE verifiedFAILED " + e.message.slice(0, 200));
              await c.end(); process.exit(1);
            }
            // The account the deployment resolves on sign-in.
            const u1 = await c.query(
              "select id, name, email, role, \"isActive\", \"authUserId\", \"lastSignedIn\" from users where lower(email) = lower($1)",
              ["joelnamuri005@gmail.com"]);
            console.log("PROBE joelRows=" + u1.rowCount);
            for (const r of u1.rows) console.log("PROBE joel " + JSON.stringify(r));
            const orphan = await c.query(
              "select count(*)::int as n from users where \"authUserId\" is null");
            console.log("PROBE usersWithoutAuthId=" + orphan.rows[0].n);
            await c.end();
          })().catch(e => { console.log("PROBE error=" + e.message); process.exit(1); });
          '

      - name: Save the CA for the deployment
        if: always()
        run: mkdir -p ca-out && cp ca.pem ca-out/prod-ca-2021.crt 2>/dev/null || echo "no ca"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: supabase-root-ca
          path: ca-out/
