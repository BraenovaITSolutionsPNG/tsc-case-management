# Temporary diagnostic, second pass: pull the TLS chain the pooler actually
# presents, and report the state of the register.
#
# The pooler signs with Supabase's own CA, so `rejectUnauthorized` fails with
# "self-signed certificate in certificate chain" and the deployment cannot
# connect. `DATABASE_CA_CERT` has to hold that CA. The root is normally not sent
# on the wire, so this also records the leaf's issuer: if the root is not in the
# chain, the exact CA to fetch is named there.
#
# The earlier raw `tls.connect` attempt failed with "wrong version number"
# because port 5432 speaks the Postgres protocol, not TLS, so the handshake has
# to be driven through node-postgres and read off the socket afterwards.
#
# No credential is printed. The users query reports ids, names and roles only,
# never a hash, and the table holds no password column to leak.
name: db probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Extract the presented certificate chain
        run: |
          node -e '
          const fs = require("node:fs");
          const { Client } = require("pg");
          const u = new URL(process.env.DATABASE_URL);
          const out = [];
          (async () => {
            const c = new Client({
              host: u.hostname, port: Number(u.port || 5432),
              user: decodeURIComponent(u.username), password: decodeURIComponent(u.password),
              database: u.pathname.replace(/^\//, ""),
              ssl: { rejectUnauthorized: false }, connectionTimeoutMillis: 15000,
            });
            await c.connect();
            let cert = c.connection.stream.getPeerCertificate(true);
            let depth = 0;
            while (cert && Object.keys(cert).length && depth < 6) {
              const pem = "-----BEGIN CERTIFICATE-----\n" +
                cert.raw.toString("base64").match(/.{1,64}/g).join("\n") +
                "\n-----END CERTIFICATE-----\n";
              out.push(pem);
              console.log("PROBE cert[" + depth + "] subject=" + JSON.stringify(cert.subject));
              console.log("PROBE cert[" + depth + "] issuer=" + JSON.stringify(cert.issuer));
              const isSelf = JSON.stringify(cert.subject) === JSON.stringify(cert.issuer);
              console.log("PROBE cert[" + depth + "] selfSigned=" + isSelf);
              if (cert.issuerCertificate === cert) { console.log("PROBE cert[" + depth + "] isRootOfChain=true"); break; }
              cert = cert.issuerCertificate; depth++;
            }
            fs.writeFileSync("/tmp/chain.pem", out.join(""));
            console.log("PROBE chainLength=" + out.length);
            // A root is self-signed; the CA this deployment needs is whichever
            // entry says so. A leaf is not usable as DATABASE_CA_CERT.
            const roots = out.filter((_, i) => i === out.length - 1);
            console.log("PROBE lastEntryIsRootCandidate=" + (out.length > 1));
            await c.end();
          })().catch(e => { console.log("PROBE error=" + e.message); });
          '

      - name: Report the register
        run: |
          node -e '
          const { Client } = require("pg");
          const u = new URL(process.env.DATABASE_URL);
          (async () => {
            const c = new Client({
              host: u.hostname, port: Number(u.port || 5432),
              user: decodeURIComponent(u.username), password: decodeURIComponent(u.password),
              database: u.pathname.replace(/^\//, ""),
              ssl: { rejectUnauthorized: false }, connectionTimeoutMillis: 15000,
            });
            await c.connect();
            const cols = await c.query(
              "select column_name from information_schema.columns where table_schema=$1 and table_name=$2 order by ordinal_position",
              ["public", "users"]);
            console.log("PROBE usersColumns=" + cols.rows.map(r => r.column_name).join(","));
            const sel = cols.rows.map(r => r.column_name)
              .filter(n => ["id","name","email","role","is_active","auth_user_id","open_id","last_signed_in"].includes(n));
            if (sel.length) {
              const rows = await c.query("select " + sel.map(n => "\"" + n + "\"").join(",") + " from users order by id");
              console.log("PROBE userRows=" + rows.rowCount);
              for (const r of rows.rows) {
                const o = {};
                for (const k of Object.keys(r)) o[k] = r[k] instanceof Date ? r[k].toISOString() : r[k];
                console.log("PROBE user " + JSON.stringify(o));
              }
            }
            const counts = await c.query(
              "select relname as t, n_live_tup as n from pg_stat_user_tables where schemaname=$1 order by relname",
              ["public"]);
            for (const r of counts.rows) console.log("PROBE count " + r.t + "=" + r.n);
            const rls = await c.query(
              "select relname, relrowsecurity from pg_class where relnamespace = $1::regnamespace and relkind = $2 order by relname",
              ["public", "r"]);
            for (const r of rls.rows) console.log("PROBE rls " + r.relname + "=" + r.relrowsecurity);
            await c.end();
          })().catch(e => { console.log("PROBE error=" + e.message); });
          '

      - name: Save the chain
        if: always()
        run: |
          mkdir -p probe-out && cp /tmp/chain.pem probe-out/chain.pem 2>/dev/null || echo "no chain"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: db-probe-chain
          path: probe-out/
